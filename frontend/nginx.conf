server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compresion basica de texto.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre (los genera Vite): cache larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # para que el enrutado del lado del cliente funcione (deep links, refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index nunca se cachea, asi un deploy nuevo se ve de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
