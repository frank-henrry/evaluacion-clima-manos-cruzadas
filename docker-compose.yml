services:
  db:
    image: postgres:16-alpine
    container_name: practica-2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-practica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-practica}
      POSTGRES_DB: ${POSTGRES_DB:-practica}
    volumes:
      # Persistencia de datos (volumen nombrado, sobrevive a `down`).
      - pgdata:/var/lib/postgresql/data
      # Seed: Postgres ejecuta los .sql de este dir SOLO al inicializar el
      # volumen vacio la primera vez. Montado read-only.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-practica} -d ${POSTGRES_DB:-practica}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Sin `ports`: la db NO se publica al host, solo es accesible en la red
    # interna del compose (el backend la alcanza como host "db").

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: practica-2-backend:latest
    container_name: practica-2-backend
    environment:
      # Se habla con la db por nombre de servicio ("db"), no localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-practica}:${POSTGRES_PASSWORD:-practica}@db:5432/${POSTGRES_DB:-practica}
      # Secreto de firma JWT: obligatorio, viene del .env del stack. NUNCA hardcodeado.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (definilo en .env)}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      # Origenes del frontend permitidos por CORS (el frontend queda en :8080).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # WeatherAPI se consume exclusivamente desde el backend.
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-https://api.weatherapi.com/v1}
      WEATHER_API_TIMEOUT_SECONDS: ${WEATHER_API_TIMEOUT_SECONDS:-5}
      # Dias hacia adelante cubiertos por el pronostico (forecast.json).
      WEATHER_FORECAST_MAX_DAYS: ${WEATHER_FORECAST_MAX_DAYS:-3}
      # Prediccion de visitantes: ubicacion fija del pronostico y lugar a predecir.
      PREDICCION_UBICACION: "${PREDICCION_UBICACION:-Huanuco, Peru}"
      PREDICCION_LUGAR_CODIGO: ${PREDICCION_LUGAR_CODIGO:-manos-cruzadas}
      # RAG de historicos: minimo para cortar el nivel de coincidencia y tope de filas.
      RAG_MIN_RESULTADOS: ${RAG_MIN_RESULTADOS:-5}
      RAG_MAX_RESULTADOS: ${RAG_MAX_RESULTADOS:-10}
      # OpenAI (agente analista) se consume exclusivamente desde el backend.
      # Sin key el analista queda no disponible; NUNCA hardcodeada.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
    ports:
      # DEBE publicarse al host: el navegador llama a http://localhost:8000
      # directamente (VITE_API_URL embebido en el bundle del frontend).
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite embebe las VITE_* en tiempo de build. Se toma de .env o del entorno;
        # nunca hardcodeado en el Dockerfile ni en la imagen.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: practica-2-frontend:latest
    container_name: practica-2-frontend
    ports:
      # Unico puerto pensado para acceso externo del usuario final -> host:contenedor.
      # nginx escucha en 80 dentro del contenedor.
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
